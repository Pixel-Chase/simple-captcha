services:
  backend:
    build:
      # 上下文为仓库根目录：镜像内会先构建 sdk 里的管理后台前端，再内嵌进 Go 服务
      context: .
      dockerfile: backend/Dockerfile
    container_name: simple-captcha-backend
    ports:
      - "3321:3321"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 全部业务配置来自 backend/.env（不入库）：cp backend/.env.example backend/.env 后按需修改。
    # 含 $ 的值要用单引号包裹。
    env_file:
      - ./backend/.env
    environment:
      # 与上方端口映射和健康检查绑定，固定写在这里，不放进 .env
      - PORT=3321
      - HOST=0.0.0.0

    volumes:
      - ./backend/logs:/app/logs
      # 背景图目录以读写方式挂载：管理后台的上传 / 删除直接落到宿主机目录
      # 需对容器内 uid 1001 可写：chown -R 1001:1001 backend/images
      - ./backend/images:/app/images
      # 管理员凭据与接入应用（只存哈希）。具名卷自动继承镜像内 /app/data 的属主；
      # 删除该卷会重新生成管理员密码，且全部应用密钥失效，down 时不要带 -v
      - captcha-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3321/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  captcha-data:
